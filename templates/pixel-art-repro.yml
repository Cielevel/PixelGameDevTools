# 资产可复现性验证：重跑全部生成脚本 → 与在盘资产逐像素比对 → pixcli 结构门禁。
# 注意：PNG 编码字节随 Pillow 版本/平台漂移（像素相同字节不同），所以比对必须
# 解码后逐像素进行而非 git diff；文本类资产（调色板 json/txt）才按字节比对。
name: pixel-art reproducibility

on:
  push:
    branches: [main]
    paths:
      - "tools/pixelart/**"
      - "assets/**"
      - ".github/workflows/pixel-art-repro.yml"
  pull_request:
    paths:
      - "tools/pixelart/**"
      - "assets/**"
      - ".github/workflows/pixel-art-repro.yml"
  workflow_dispatch:

env:
  PYTHONUTF8: "1"

jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装依赖（唯一第三方依赖 Pillow）
        run: python -m pip install Pillow

      - name: 备份在盘资产
        run: cp -r assets /tmp/pristine

      - name: 全量重跑生成脚本
        run: |
          set -e
          for f in tools/pixelart/generation/gen_*.py; do
            echo ":: $f"
            python "$f" > /dev/null
          done

      - name: 像素级零差异验证（重跑产物 vs 在盘资产）
        run: |
          python - <<'EOF'
          import os, subprocess, sys
          from PIL import Image

          st = subprocess.run(["git", "status", "--short", "assets/"],
                              capture_output=True, text=True).stdout.splitlines()
          bad = []
          for line in st:
              code, path = line[:2].strip(), line[3:].strip()
              pri = os.path.join("/tmp/pristine", os.path.relpath(path, "assets"))
              if code == "??":
                  bad.append((path, "重跑产生了未入库的新文件")); continue
              if code == "D":
                  bad.append((path, "重跑后文件消失")); continue
              if not path.lower().endswith(".png"):
                  if open(pri, "rb").read() != open(path, "rb").read():
                      bad.append((path, "文本资产字节差异"))
                  continue
              a = Image.open(pri).convert("RGBA")
              b = Image.open(path).convert("RGBA")
              if a.size != b.size:
                  bad.append((path, "尺寸变化")); continue
              pa, pb = a.load(), b.load()
              w, h = a.size
              n = sum(1 for y in range(h) for x in range(w) if pa[x, y] != pb[x, y])
              if n:
                  bad.append((path, f"{n} 像素差异"))
          if bad:
              for p, why in bad:
                  print(f"REAL DIFF {p}: {why}")
              sys.exit(1)
          print(f"零差异验证通过：重跑触及 {len(st)} 个文件，全部与在盘资产逐像素/逐字节一致")
          EOF

      - name: pixcli 全量审计（逐资产 check + atlas 一致性 + sheet/JSON 齐备）
        run: python tools/pixelart/pixcli.py audit assets/sprites
